<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventIF | Meus ingressos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-navy sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EventIF</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="ingressos.html">Meus ingressos</a>
                    </li>
                    <li class="nav-item">
                        <a class="ticket-counter" href="ingressos.html">
                            <span id="contadorIngressos">0</span> ingressos
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="page-heading">
            <span class="section-kicker">Selecao atual</span>
            <h1>Meus ingressos</h1>
        </div>

        <div class="row g-4 align-items-start">
            <section class="col-lg-8">
                <div id="listaIngressos"></div>
            </section>

            <aside class="col-lg-4">
                <div class="summary-box">
                    <h2>Resumo</h2>
                    <div class="coupon-area">
                        <label for="campoCupom" class="form-label">Codigo promocional</label>
                        <div class="input-group">
                            <input type="text" id="campoCupom" class="form-control" placeholder="ESTUDANTE10">
                            <button id="btnAplicarCupom" class="btn btn-primary" type="button">Aplicar</button>
                        </div>
                        <button id="btnRemoverCupom" class="btn btn-link px-0 d-none" type="button">Remover cupom</button>
                        <div id="mensagemCupom" class="small mt-2"></div>
                    </div>

                    <div class="summary-lines">
                        <div>
                            <span>Total de ingressos</span>
                            <strong id="totalIngressos">0</strong>
                        </div>
                        <div>
                            <span>Subtotal</span>
                            <strong id="subtotalIngressos">R$ 0,00</strong>
                        </div>
                        <div>
                            <span>Desconto</span>
                            <strong id="descontoIngressos">R$ 0,00</strong>
                        </div>
                        <div class="final-total">
                            <span>Valor final</span>
                            <strong id="totalFinalIngressos">R$ 0,00</strong>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>EventIF — Projeto de Desenvolvimento Web</p>
            <p>Desenvolvido por Kauan de Melo Zembruski</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/eventos.js"></script>
    <script src="js/ingressos.js"></script>
</body>
</html>
